name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Verify (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest playwright

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Verify Diagram Doctor
        run: |
          diagram doctor

      - name: Smoke Test CLI Scaffolding, Check & Export
        run: |
          diagram list
          diagram new architecture --title "CI Verification Diagram" --output ci-test.html
          diagram check ci-test.html
          diagram export ci-test.html --format both
